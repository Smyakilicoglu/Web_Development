<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bayrak</title>
    <style>
        .slm {
            background-color: red;
            height: 600px;
            width: 900px;
            position: relative;
        }
        .slm > div {
            position: absolute;
            left: 10px;
            top: 40px;
            border-radius: 50%;
            width: 500px;
            height: 500px;
            background-color: white;
        }
        .slm > div > div {
           position: absolute;
           left: 100px;
           top: 50px;
           border-radius: 50%;
           width: 400px;
           height: 400px;
           background-color: red;
        }
    </style>
</head>
<body>
    <div class="slm">
        <div>
            <div></div>
        </div>
    </div>
</body>
</html>
